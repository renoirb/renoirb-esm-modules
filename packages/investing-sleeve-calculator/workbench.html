<!DOCTYPE html>
<html>

<head>
  <title>Workbench</title>
  <script type="module">
    import {
      SleeveCalculator,
      DriftCalculator,
    } from '@renoirb/investing-sleeve-calculator'

    window.SleeveCalculator = SleeveCalculator
    window.DriftCalculator = DriftCalculator

    /**
     * @type {import('@renoirb/investing-sleeve-calculator').SleeveCalculatorConfig}
     */
    const SLEEVES_CONFIG = /** @type {const} */ ({
      sleeves: {
        core: {
          /**
           * **WARNING:** ============== **This is NOT financial advice** =====================
           * This is just an example configuration so I can re-balance my own portfolio, less manually.
           * But if you like want to know where I've learned about this portoflio allocation;
           * Lookup Ben Felix <https://pwlcapital.com/our-team/benjamin-felix/> from PWL Capital's YouTube channel.
           * Particularly his videos on the work from Portfolio theory by Fama-French named "Five Factor" investing.
           */
          weights: {
            AVDV:  6, // Avantis® International Small Cap Value ETF (USD)
            AVUV: 10, // Avantis® U.S. Small Cap Value ETF (USD)
            VUN:  30, // Vanguard US Total Market ETF (CAD-hedged)
            XIC:  30, // Core S&P/TSX Capped Composite ETF (Canadian)
            XEF:  16, // Core MSCI EAFE IMI ETF (International Developed)
            XEC:   8, // Core MSCI EM IMI (Developed Markets)
          },
          usd_symbols: [
            'AVDV',
            'AVUV',
          ],
        }
      }
    })
    window.SLEEVES_CONFIG = SLEEVES_CONFIG
    window.calculator = new SleeveCalculator(SLEEVES_CONFIG)

    console.log('workbench.html - 0', { 
      calculator: window.calculator, 
      SLEEVES_CONFIG: window.SLEEVES_CONFIG, 
      SleeveCalculator: window.SleeveCalculator, 
    })


  </script>
</head>

<body>
  <section>
    <my-component-showcase
      name="Investing Sleeve Calculator"
      slots="alpha"
    >
      <template
        slot="alpha"
        title="Visualize Amounts for Sleeve 'core' at 5K"
      >
        ...
      </template>
    </my-component-showcase>
    <div>
      <h2>Investing Sleeve Calculator</h2>
      <div id="alpha-output">
        <p>Loading...</p>
      </div>
    </div>
  </section>

  <script type="module">
    console.log('workbench.html - 1', { 
      calculator: window.calculator, 
      SLEEVES_CONFIG: window.SLEEVES_CONFIG, 
      SleeveCalculator: window.SleeveCalculator, 
    })

    const fragmentCreateFor = (sleeveCalcResult) => {
      const {
        exchangeRate,
        sleeveName,
        totalAmountCAD,
        targets,
        summary,
      } = sleeveCalcResult

      const frag = document.createDocumentFragment()

      const blockTitle = document.createElement('h3')
      blockTitle.textContent = `Sleeve '${sleeveName}' allocation for $${totalAmountCAD} at ${exchangeRate}`
      const blockTable = document.createElement('table')
      const blockTableHeader = document.createElement('thead')
      const blockTableHeaderCells = `<th>Symbol</th><th>Target Amount</th><th>Weight</th><th>Normalized Weight</th>`
      blockTableHeader.innerHTML = blockTableHeaderCells
      blockTable.append(blockTableHeader)
      const blockTableBody = document.createElement('tbody')
      for (const { symbol, targetAmount, currency, weight, normalizedWeight } of targets) {
        const blockTableRow = document.createElement('tr')
        const blockTableRowCells  = `<th>${symbol}</th><td>${targetAmount.toFixed(2)} ${currency}</td><td>${weight}%</td><td>${normalizedWeight}%)</td>`
        blockTableRow.innerHTML = blockTableRowCells
        blockTableBody.append(blockTableRow)
      }
      frag?.appendChild(blockTitle)
      frag?.appendChild(blockTableBody)

      return frag
    }

    const calcResult = calculator.calculate(
      'core',
      5000,
      1.38,
    )

    const el = document.getElementById('alpha-output')
    console.log('workbench.html - 2', { el, calcResult })
    const fragment = fragmentCreateFor(calcResult)
    const foo = document.createElement('p')
    el?.replaceWith(fragment)
  </script>
</body>

</html>
